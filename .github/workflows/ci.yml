name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Déployer en production (main uniquement, après validations)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: dsolar-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production && 'production' || 'validation' }}
  # Ne jamais interrompre une livraison de production manuelle.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_production }}
jobs:
  backend:
    name: Validation backend
    uses: ./.github/workflows/backend.yml
  frontend:
    name: Validation frontend
    uses: ./.github/workflows/frontend.yml
    with:
      phase: quality
  migration:
    name: Validation migrations
    uses: ./.github/workflows/migration.yml
  integration:
    name: Intégration
    needs: [backend, frontend]
    uses: ./.github/workflows/frontend.yml
    with:
      phase: integration
  quality-gate:
    name: Contrôle qualité global
    if: ${{ always() }}
    needs: [backend, frontend, integration, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier les deux validations
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INTEGRATION: ${{ needs.integration.result }}
          MIGRATION: ${{ needs.migration.result }}
        run: |
          printf 'Backend : %s\nFrontend : %s\nIntégration : %s\nMigration : %s\n' "$BACKEND" "$FRONTEND" "$INTEGRATION" "$MIGRATION"
          test "$BACKEND" = success && test "$FRONTEND" = success &&
            test "$INTEGRATION" = success && test "$MIGRATION" = success
  release:
    name: Livraison et déploiement
    needs: [quality-gate]
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_production: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production }}
