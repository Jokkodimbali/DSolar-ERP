name: Qualité frontend
on:
  push:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend-quality.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: frontend
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        id: install
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            node -e "const fs=require('node:fs'); const data=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<data.length;i+=8000) console.log('FRONTEND_LOCK:'+data.slice(i,i+8000));"
          fi
      - run: npm run typecheck
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Contrôler le formatage
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Préparer le correctif de formatage
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          npm run format
          git diff --binary -- src angular.json 'tsconfig*.json' package.json > /tmp/dsolar-front-format.patch
          node -e "const fs=require('node:fs'); const data=fs.readFileSync('/tmp/dsolar-front-format.patch').toString('base64'); for(let i=0;i<data.length;i+=8000) console.log('FRONTEND_FORMAT:'+data.slice(i,i+8000));"
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
