name: Format delivery implementation
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-deliveries-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write "src/modules/sales/**/*.ts"
      - name: Commit formatted source
        run: |
          if ! git diff --quiet -- src/modules/sales; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/sales
            git commit -m "style(sales): format delivery implementation"
            git push origin HEAD:dev
          fi
