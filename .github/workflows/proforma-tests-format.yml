name: One-time proforma tests formatting
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: backend
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/modules/sales/infrastructure/prisma-proformas.repository.spec.ts
      - run: npm run format:check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/sales/infrastructure/prisma-proformas.repository.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(sales): format proforma transition tests"
            git push origin HEAD:dev
          fi
