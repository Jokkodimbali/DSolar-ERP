name: Format security hardening once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-security-hardening-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write "src/modules/sales/**/*.ts" "src/modules/identity/presentation/access.guard*.ts"
      - name: Commit formatted code
        run: |
          if ! git diff --quiet -- src/modules/sales src/modules/identity/presentation; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/sales src/modules/identity/presentation
            git commit -m "style: format security and accounting safeguards"
            git push origin HEAD:dev
          fi
