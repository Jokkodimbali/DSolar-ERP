name: One-time sales formatting
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-sales-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write "src/modules/sales/**/*.ts" "src/modules/identity/infrastructure/prisma-bootstrap.repository.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/sales src/modules/identity/infrastructure/prisma-bootstrap.repository.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(sales): apply Prettier consistently"
            git push origin HEAD:dev
          fi
