name: Format inventory files once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-rbac-once.yml'
permissions:
  contents: write
concurrency:
  group: inventory-format-dev
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply Prettier only to failing inventory files
        run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write src/modules/inventory/infrastructure/prisma-goods-receipts.repository.spec.ts src/modules/inventory/infrastructure/prisma-goods-receipts.repository.ts src/modules/inventory/application/purchase-orders.repository.spec.ts src/modules/inventory/application/purchase-orders.repository.ts
      - name: Commit formatting only if changed
        run: |
          if ! git diff --quiet -- src/modules/inventory/infrastructure/prisma-goods-receipts.repository.spec.ts src/modules/inventory/infrastructure/prisma-goods-receipts.repository.ts src/modules/inventory/application/purchase-orders.repository.spec.ts src/modules/inventory/application/purchase-orders.repository.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/inventory/infrastructure/prisma-goods-receipts.repository.spec.ts src/modules/inventory/infrastructure/prisma-goods-receipts.repository.ts src/modules/inventory/application/purchase-orders.repository.spec.ts src/modules/inventory/application/purchase-orders.repository.ts
            git commit -m "style(sales): apply Prettier to inventory repository and tests"
            git push origin HEAD:dev
          fi
