name: Format RBAC once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-rbac-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write src/modules/identity/application/user-management.service.spec.ts src/modules/identity/infrastructure/prisma-user.repository.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/identity
            git commit -m "style: format RBAC tests and repository"
            git push origin HEAD:dev
          fi
