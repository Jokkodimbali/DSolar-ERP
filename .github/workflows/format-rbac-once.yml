name: Format backend fixes once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-rbac-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write src/modules/sales/application/payments.port.ts src/modules/sales/application/payments.service.ts src/modules/sales/infrastructure/prisma-payments.repository.ts src/modules/sales/presentation/payments.controller.ts src/modules/identity/application/user-management.service.ts src/modules/inventory/infrastructure/prisma-inventory.repository.ts src/modules/sales/application/payments.service.spec.ts src/modules/identity/presentation/login-rate-limit.guard.ts src/modules/identity/presentation/auth.controller.ts src/modules/identity/identity.module.ts src/modules/identity/presentation/login-rate-limit.guard.spec.ts src/modules/inventory/infrastructure/prisma-transfers.repository.ts src/modules/sales/presentation/create-delivery.dto.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/sales src/modules/identity src/modules/inventory
            git commit -m "style: format backend corrections"
            git push origin HEAD:dev
          fi
