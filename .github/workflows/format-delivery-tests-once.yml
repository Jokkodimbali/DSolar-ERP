name: Format delivery tests once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-delivery-tests-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format current dev tests
        run: |
          git fetch origin dev
          git reset --hard origin/dev
          npx prettier --write src/modules/sales/infrastructure/prisma-deliveries.repository.spec.ts src/modules/sales/presentation/create-delivery.dto.spec.ts
      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/sales
            git commit -m "style(deliveries): format repository and DTO tests"
            git push origin HEAD:dev
          fi
