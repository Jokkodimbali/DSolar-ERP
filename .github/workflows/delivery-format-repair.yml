name: One-time delivery formatting
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/delivery-format-repair.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/modules/sales/infrastructure/prisma-deliveries.repository.ts src/modules/sales/infrastructure/prisma-deliveries.repository.spec.ts
      - run: npm run format:check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/sales/infrastructure/prisma-deliveries.repository.ts src/modules/sales/infrastructure/prisma-deliveries.repository.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(sales): format delivery repository and tests"
            git push origin HEAD:dev
          fi
