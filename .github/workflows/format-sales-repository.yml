name: Format sales repository
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-sales-repository.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/sales/infrastructure/prisma-orders.repository.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet -- src/modules/sales/infrastructure/prisma-orders.repository.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/sales/infrastructure/prisma-orders.repository.ts
            git commit -m "style(sales): apply Prettier formatting"
            git push origin HEAD:dev
          fi
