name: Migration
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
jobs:
  validate:
    name: Validation Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsolar_test
          POSTGRES_PASSWORD: dsolar_test
          POSTGRES_DB: dsolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsolar_test -d dsolar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
      DIRECT_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Valider le schéma Prisma
        run: npm run prisma:validate
      - name: Appliquer toutes les migrations sur PostgreSQL éphémère
        run: npm run prisma:deploy
      - name: Vérifier le statut des migrations
        run: npx --no-install prisma migrate status
      - name: Vérifier la réexécution sans nouvelle migration
        run: |
          set -euo pipefail
          npm run prisma:deploy
          npx --no-install prisma migrate status
          printf '%s\n' 'Migrations validées sur PostgreSQL éphémère uniquement. Aucune base Neon modifiée.' >> "$GITHUB_STEP_SUMMARY"
