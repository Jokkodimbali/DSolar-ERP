name: Format dashboard once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-dashboard-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format dashboard files with repository Prettier
        run: npx prettier --write "src/modules/dashboard/**/*.ts"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/dashboard
          if ! git diff --cached --quiet; then
            git commit -m "style(dashboard): apply repository Prettier formatting"
            git push origin HEAD:dev
          fi
