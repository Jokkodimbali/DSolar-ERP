name: Vérifier la migration initiale Prisma
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des migrations versionnées
        run: |
          test -s prisma/migrations/20261112_initial/migration.sql
          test -s prisma/migrations/migration_lock.toml
          echo "Les migrations déjà versionnées ne doivent jamais être régénérées."
