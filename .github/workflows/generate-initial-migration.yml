name: Générer migration Prisma initiale
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/generate-initial-migration.yml'
      - 'prisma/schema.prisma'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Générer SQL depuis le schéma Prisma
        run: |
          mkdir -p prisma/migrations/20261112_initial
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261112_initial/migration.sql
          test -s prisma/migrations/20261112_initial/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Publier la migration sur dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          if ! git diff --cached --quiet; then
            git commit -m "db: generate initial Prisma migration"
            git push
          fi
