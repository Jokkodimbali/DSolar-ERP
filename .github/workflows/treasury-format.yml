name: Formatage ponctuel des modules financiers et retours
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/treasury-format.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Appliquer le formatage Prettier officiel
        run: npx prettier --write 'src/modules/treasury/**/*.ts' 'src/modules/expenses/**/*.ts' 'src/modules/supplier-returns/**/*.ts' 'src/modules/accounting/**/*.ts' src/app.module.ts src/modules/sales/infrastructure/prisma-payments.repository.ts
      - run: npm run format:check
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - name: Enregistrer uniquement les corrections de formatage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/treasury src/modules/expenses src/modules/supplier-returns src/modules/accounting src/app.module.ts src/modules/sales/infrastructure/prisma-payments.repository.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to updated modules"
            git push origin HEAD:dev
          fi
