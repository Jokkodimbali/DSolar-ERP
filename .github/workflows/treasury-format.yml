name: Formatage et intégrité des sources comptables
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: backend
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Appliquer le formatage Prettier officiel
        run: npx prettier --write 'src/modules/treasury/**/*.ts' 'src/modules/expenses/**/*.ts' 'src/modules/supplier-returns/**/*.ts' 'src/modules/accounting/**/*.ts' 'src/modules/sales/**/*.ts' src/app.module.ts src/main.ts src/health.controller.ts 'src/infrastructure/http/**/*.ts' 'src/infrastructure/prisma/**/*.ts' 'src/modules/identity/**/*.ts' 'src/modules/stores/**/*.ts' 'src/modules/audit/**/*.ts' 'src/modules/inventory/**/*.ts' src/modules/sales/infrastructure/prisma-payments.repository.ts scripts/integration-smoke.cjs
      - run: npm run format:check
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - name: Enregistrer uniquement les corrections de formatage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/prisma src/modules/audit src/modules/inventory src/modules/stores src/modules/treasury src/modules/expenses src/modules/supplier-returns src/modules/accounting src/modules/sales src/modules/identity src/infrastructure/http src/main.ts src/health.controller.ts src/app.module.ts src/modules/sales/infrastructure/prisma-payments.repository.ts scripts/integration-smoke.cjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to updated modules"
            git push origin HEAD:dev
          fi
