name: Réparation ponctuelle du formatage
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-repair.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Formater les sources avec Prettier
        run: npx prettier --write "src/**/*.ts" "*.json" "*.md"
      - name: Vérifier le formatage
        run: npm run format:check
      - name: Enregistrer les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src '*.json' '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to backend sources"
            git push origin HEAD:dev
          fi
