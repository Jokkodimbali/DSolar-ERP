name: Qualité backend
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Générer le client Prisma
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - name: Valider Prisma
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --passWithNoTests

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsolar_test
          POSTGRES_PASSWORD: dsolar_test
          POSTGRES_DB: dsolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsolar_test -d dsolar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
      DIRECT_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Générer Prisma
        run: npm run prisma:generate
      - name: Appliquer toutes les migrations sur PostgreSQL éphémère
        run: npm run prisma:deploy
      - name: Vérifier la conformité du schéma
        run: npx prisma migrate status
      - name: Exécuter les tests d'intégration PostgreSQL
        run: npm run test:integration
      - name: Tester les opérations de trésorerie sur PostgreSQL
        run: npm test -- --runTestsByPath src/modules/treasury/infrastructure/treasury.integration.spec.ts src/modules/expenses/infrastructure/expenses.integration.spec.ts src/modules/supplier-returns/infrastructure/supplier-returns.integration.spec.ts src/modules/accounting/infrastructure/accounting.integration.spec.ts src/modules/accounting/infrastructure/bank.integration.spec.ts src/modules/identity/infrastructure/auth-rate-limit.integration.spec.ts src/modules/stores/infrastructure/store-isolation.integration.spec.ts
        env:
          TREASURY_INTEGRATION: '1'
      - name: Provisionner un rôle applicatif non propriétaire
        env:
          PGPASSWORD: dsolar_test
        run: |
          psql -h localhost -U dsolar_test -d dsolar_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dsolar_runtime_test LOGIN PASSWORD 'dsolar_runtime_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
          REVOKE TEMPORARY ON DATABASE dsolar_test FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
          psql -h localhost -U dsolar_test -d dsolar_test -v runtime_role=dsolar_runtime_test -f scripts/provision-runtime-role.sql
      - name: Vérifier les droits du compte applicatif réel
        run: node scripts/runtime-role-smoke.cjs
        env:
          DATABASE_URL: postgresql://dsolar_runtime_test:dsolar_runtime_test@localhost:5432/dsolar_test?schema=public
          DIRECT_URL: postgresql://dsolar_runtime_test:dsolar_runtime_test@localhost:5432/dsolar_test?schema=public
