name: Qualité backend
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Formater le projet
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: npm run format
      - name: Versionner le formatage et le lockfile
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "style: appliquer Prettier et synchroniser les dépendances"
            git push
          fi
      - name: Générer le client Prisma
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - name: Valider Prisma
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --passWithNoTests
