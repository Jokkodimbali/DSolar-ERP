name: Qualité backend
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Générer le client Prisma
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - name: Valider Prisma
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - name: Diagnostic formatage des rapports
        run: |
          npx prettier --write src/modules/sales/infrastructure/prisma-sales-report.repository.ts src/modules/sales/infrastructure/prisma-sales-report.repository.spec.ts
          git diff -- src/modules/sales/infrastructure/prisma-sales-report.repository.ts src/modules/sales/infrastructure/prisma-sales-report.repository.spec.ts
      - run: npm run format:check
      - run: npm test -- --passWithNoTests

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsolar_test
          POSTGRES_PASSWORD: dsolar_test
          POSTGRES_DB: dsolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsolar_test -d dsolar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
      DIRECT_URL: postgresql://dsolar_test:dsolar_test@localhost:5432/dsolar_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Générer Prisma
        run: npm run prisma:generate
      - name: Appliquer toutes les migrations sur PostgreSQL éphémère
        run: npm run prisma:deploy
      - name: Vérifier la conformité du schéma
        run: npx prisma migrate status
      - name: Exécuter les tests d'intégration PostgreSQL
        run: npm run test:integration
