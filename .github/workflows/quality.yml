name: Qualité backend
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Générer le client Prisma
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - name: Valider Prisma
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/dsolar_erp?schema=public
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --passWithNoTests
